name: lungai

services:
  lungai-backend:
    container_name: lungai-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - "./backend/app/uploads:/app/app/uploads"
      - "./backend/lungai.db:/app/lungai.db"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lungai-network

  lungai-frontend:
    container_name: lungai-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      lungai-backend:
        condition: service_healthy
    networks:
      - lungai-network

networks:
  lungai-network:
    name: lungai-network
