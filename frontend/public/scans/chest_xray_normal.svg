<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Dark Radiograph Background -->
  <rect width="800" height="800" fill="#05070a"/>
  
  <!-- Soft Thoracic Soft-Tissue Outline -->
  <ellipse cx="400" cy="420" rx="310" ry="340" fill="#141a24" opacity="0.8"/>
  
  <!-- Clear Normal Lung Fields -->
  <path d="M 230,220 Q 220,400 240,580 Q 320,620 370,550 Q 350,350 330,220 Z" fill="#05080d" opacity="0.95"/>
  <path d="M 570,220 Q 580,400 560,580 Q 480,620 430,550 Q 450,350 470,220 Z" fill="#05080d" opacity="0.95"/>

  <!-- Cardiac Silhouette -->
  <path d="M 370,380 Q 470,450 440,550 Q 370,560 360,420 Z" fill="#263140" opacity="0.75"/>

  <!-- Central Spine / Vertebral Column -->
  <rect x="388" y="120" width="24" height="520" fill="#334155" opacity="0.7" rx="6"/>
  <g fill="#475569" opacity="0.6">
    <rect x="382" y="160" width="36" height="14" rx="3"/>
    <rect x="382" y="200" width="36" height="14" rx="3"/>
    <rect x="382" y="240" width="36" height="14" rx="3"/>
    <rect x="382" y="280" width="36" height="14" rx="3"/>
    <rect x="382" y="320" width="36" height="14" rx="3"/>
    <rect x="382" y="360" width="36" height="14" rx="3"/>
    <rect x="382" y="400" width="36" height="14" rx="3"/>
    <rect x="382" y="440" width="36" height="14" rx="3"/>
    <rect x="382" y="480" width="36" height="14" rx="3"/>
    <rect x="382" y="520" width="36" height="14" rx="3"/>
    <rect x="382" y="560" width="36" height="14" rx="3"/>
  </g>

  <!-- Clavicles -->
  <path d="M 400,190 Q 280,180 180,210 Q 280,195 400,200" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M 400,190 Q 520,180 620,210 Q 520,195 400,200" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" opacity="0.75"/>

  <!-- Trachea -->
  <rect x="393" y="110" width="14" height="110" fill="#05080d" opacity="0.85" rx="4"/>

  <!-- Rib Bilateral Curved Arcs -->
  <g fill="none" stroke="#475569" stroke-width="10" opacity="0.55" stroke-linecap="round">
    <path d="M 390,230 Q 240,240 190,300"/>
    <path d="M 390,270 Q 230,290 180,360"/>
    <path d="M 390,320 Q 220,350 175,430"/>
    <path d="M 390,370 Q 215,410 175,490"/>
    <path d="M 390,420 Q 215,470 180,550"/>
    <path d="M 390,470 Q 220,530 190,600"/>
    <path d="M 410,230 Q 560,240 610,300"/>
    <path d="M 410,270 Q 570,290 620,360"/>
    <path d="M 410,320 Q 580,350 625,430"/>
    <path d="M 410,370 Q 585,410 625,490"/>
    <path d="M 410,420 Q 585,470 620,550"/>
    <path d="M 410,470 Q 580,530 610,600"/>
  </g>

  <!-- Diaphragmatic Domes -->
  <path d="M 160,610 Q 270,550 380,600 L 380,650 L 160,650 Z" fill="#334155" opacity="0.8"/>
  <path d="M 420,600 Q 530,560 640,610 L 640,650 L 420,650 Z" fill="#334155" opacity="0.8"/>

  <!-- Radiograph Marker -->
  <text x="120" y="160" font-family="monospace" font-size="42" font-weight="bold" fill="#64748b" opacity="0.8">R</text>
  <text x="120" y="190" font-family="sans-serif" font-size="14" fill="#475569" opacity="0.6">PA NORMAL</text>
</svg>
